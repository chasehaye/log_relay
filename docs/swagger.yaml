basePath: /
definitions:
  internal_handlers.StatusResponse:
    properties:
      database:
        example: conntect?
        type: string
      status:
        example: healthy?
        type: string
    type: object
  internal_handlers_auth.CycleTokenResponse:
    properties:
      api_token:
        example: new_lr_7f8e9d0a1b2c3d4e5f...
        type: string
      message:
        example: API Token updated successfully
        type: string
    type: object
  internal_handlers_auth.ForgotPasswordInput:
    properties:
      email:
        example: user@example.com
        maxLength: 255
        type: string
    required:
    - email
    type: object
  internal_handlers_auth.ForgotPasswordResponse:
    properties:
      message:
        example: Check your inbox for a reset link
        type: string
    type: object
  internal_handlers_auth.LogOutResponse:
    properties:
      message:
        example: Successfully logged out
        type: string
    type: object
  internal_handlers_auth.LoginInput:
    properties:
      email:
        example: user@example.com
        maxLength: 255
        type: string
      password:
        example: SecurePass123!
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  internal_handlers_auth.LoginResponse:
    properties:
      is_admin:
        example: false
        type: boolean
      message:
        example: Login successful
        type: string
      user_email:
        example: user@example.com
        type: string
      user_name:
        example: User Name
        type: string
    type: object
  internal_handlers_auth.PasswordInput:
    properties:
      password:
        example: SecurePass123!
        maxLength: 72
        minLength: 8
        type: string
    required:
    - password
    type: object
  internal_handlers_auth.RegisterInput:
    properties:
      email:
        example: user@example.com
        maxLength: 255
        type: string
      name:
        example: User Name
        maxLength: 255
        type: string
      password:
        example: SecurePass123!
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  internal_handlers_auth.RegisterResponse:
    properties:
      api_token:
        example: abcdef_gh1234!@#zxcv
        type: string
      is_admin:
        example: false
        type: boolean
      message:
        example: Registration successful
        type: string
      user_email:
        example: user@example.com
        type: string
      user_name:
        example: User Name
        type: string
    type: object
  internal_handlers_auth.ResetPasswordResponse:
    properties:
      message:
        example: Password updated successfully
        type: string
    type: object
  internal_handlers_contact.EmailInput:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  internal_handlers_contact.SubscribeConfirmResponse:
    properties:
      list_name:
        type: string
      message:
        type: string
    type: object
  internal_handlers_contact.SuccessResponse:
    properties:
      message:
        example: Operation successful
        type: string
    type: object
  internal_handlers_contact.UnsubscribeInput:
    properties:
      token:
        type: string
    type: object
  internal_handlers_contact.UnsubscribeResponse:
    properties:
      list:
        type: string
      message:
        type: string
    type: object
  internal_handlers_list.ContactResponse:
    properties:
      email:
        type: string
    type: object
  internal_handlers_list.ListDetailResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      list_type:
        type: string
      messages:
        items:
          $ref: '#/definitions/internal_handlers_list.MessageResponse'
        type: array
      name:
        type: string
      public_facing_name:
        type: string
      public_id:
        type: string
      subscribers:
        items:
          $ref: '#/definitions/internal_handlers_list.ContactResponse'
        type: array
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  internal_handlers_list.ListIndexResponse:
    properties:
      current_page:
        type: integer
      lists:
        items:
          $ref: '#/definitions/internal_handlers_list.ListResponse'
        type: array
      total_count:
        type: integer
      total_pages:
        type: integer
    type: object
  internal_handlers_list.ListInput:
    properties:
      list_type:
        type: string
      name:
        type: string
      public_facing_name:
        type: string
    required:
    - list_type
    - name
    - public_facing_name
    type: object
  internal_handlers_list.ListPublicNameResponse:
    properties:
      name:
        type: string
    type: object
  internal_handlers_list.ListResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      list_type:
        type: string
      name:
        type: string
      public_facing_name:
        type: string
      public_id:
        type: string
      user_id:
        type: integer
    type: object
  internal_handlers_list.MessageResponse:
    properties:
      body:
        type: string
      header:
        type: string
      id:
        type: integer
    type: object
  internal_handlers_list.SuccessMessageResponse:
    properties:
      message:
        example: Operation successful
        type: string
    type: object
  internal_handlers_messages.SendBugReportInput:
    properties:
      body:
        type: string
      email:
        example: user@example.com
        maxLength: 255
        type: string
      header:
        type: string
    required:
    - body
    - email
    - header
    type: object
  internal_handlers_messages.SendMessageInput:
    properties:
      body:
        type: string
      header:
        type: string
    required:
    - body
    - header
    type: object
  internal_handlers_messages.SuccessMessageResponse:
    properties:
      message:
        example: Operation successful
        type: string
    type: object
  internal_handlers_user.ChangeEmailConfirmInput:
    properties:
      token:
        type: string
    type: object
  internal_handlers_user.ChangeEmailInput:
    properties:
      email:
        example: user@example.com
        maxLength: 255
        type: string
    required:
    - email
    type: object
  internal_handlers_user.ChangeUsernameInput:
    properties:
      name:
        example: User Name
        maxLength: 255
        type: string
    type: object
  internal_handlers_user.PasswordInput:
    properties:
      password:
        example: SecurePass123!
        maxLength: 72
        minLength: 8
        type: string
    required:
    - password
    type: object
  internal_handlers_user.SuccessMessageResponse:
    properties:
      message:
        example: Successfully updated the username
        type: string
    type: object
  log_relay_internal_dtos.AlreadyExistsResponse:
    properties:
      error:
        example: Already in use
        type: string
    type: object
  log_relay_internal_dtos.ForbiddenResponse:
    properties:
      error:
        example: You do not have permission to perform this action
        type: string
    type: object
  log_relay_internal_dtos.NotFoundErrorResponse:
    properties:
      error:
        example: Resource not found
        type: string
    type: object
  log_relay_internal_dtos.ServerErrorResponse:
    properties:
      error:
        example: An unexpected error occurred
        type: string
    type: object
  log_relay_internal_dtos.UnauthorizedResponse:
    properties:
      error:
        example: Invalid credentials or session
        type: string
    type: object
  log_relay_internal_dtos.ValidationErrorResponse:
    properties:
      details:
        additionalProperties:
          type: string
        type: object
      error:
        example: Validation failed
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API Server for Log Relay Project.
  title: Log Relay API
  version: "1.0"
paths:
  /api/list/create:
    post:
      consumes:
      - application/json
      description: Create a new list and returns the created list and a success message
      parameters:
      - description: List Creation Data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/internal_handlers_list.ListInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_handlers_list.ListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ValidationErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.UnauthorizedResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.AlreadyExistsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ServerErrorResponse'
      summary: Create New List
      tags:
      - lists
  /api/list/delete/{id}:
    delete:
      consumes:
      - application/json
      description: Deletes a list and all associated messages
      parameters:
      - description: List ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers_list.SuccessMessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.UnauthorizedResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.NotFoundErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ServerErrorResponse'
      summary: Delete a list
      tags:
      - lists
  /api/list/detail/{id}:
    get:
      consumes:
      - application/json
      description: Returns a single list with messages and subscribers
      parameters:
      - description: List ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers_list.ListDetailResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.UnauthorizedResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.NotFoundErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ServerErrorResponse'
      summary: Get list details
      tags:
      - lists
  /api/list/index/project:
    get:
      consumes:
      - application/json
      description: Returns a paginated list of user inquiry and bug lists with metadata
      parameters:
      - description: Number of items per page (1-50)
        in: query
        name: count_per_page
        required: true
        type: integer
      - description: Page number (starts from 1)
        in: query
        name: page
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers_list.ListIndexResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ValidationErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ServerErrorResponse'
      summary: Get paginated inquiry and bug lists
      tags:
      - lists
  /api/lists:
    get:
      consumes:
      - application/json
      description: Returns a paginated list of user lists with metadata
      parameters:
      - description: Number of items per page (1-50)
        in: query
        name: count_per_page
        required: true
        type: integer
      - description: Page number (starts from 1)
        in: query
        name: page
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers_list.ListIndexResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ValidationErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ServerErrorResponse'
      summary: Get paginated lists
      tags:
      - lists
  /api/lists/{list_id}:
    get:
      consumes:
      - application/json
      description: Returns the public-facing name of a mailing list by its public
        ID
      parameters:
      - description: Public List ID
        in: path
        name: list_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers_list.ListPublicNameResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.NotFoundErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ServerErrorResponse'
      summary: Get public mailing list name
      tags:
      - lists
  /api/mail/send/{list_id}:
    post:
      consumes:
      - application/json
      description: Creates a message and queues it for sending to all subscribers
        in a list
      parameters:
      - description: Mailing List ID
        in: path
        name: list_id
        required: true
        type: integer
      - description: Message payload
        in: body
        name: message
        required: true
        schema:
          $ref: '#/definitions/internal_handlers_messages.SendMessageInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_handlers_messages.SuccessMessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ValidationErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.UnauthorizedResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.NotFoundErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ServerErrorResponse'
      summary: Send message to mailing list
      tags:
      - messages
  /api/send/message/{list_id}:
    post:
      consumes:
      - application/json
      description: Creates or reuses a contact and stores an inbound message associated
        with a specific list
      parameters:
      - description: Public List ID
        in: path
        name: list_id
        required: true
        type: string
      - description: Inbound message payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers_messages.SendBugReportInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_handlers_messages.SuccessMessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ValidationErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.UnauthorizedResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ForbiddenResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.NotFoundErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ServerErrorResponse'
      summary: Send inbound message to a list
      tags:
      - messages
  /api/status:
    get:
      description: Checks if the API and Database are reachable.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.StatusResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handlers.StatusResponse'
      summary: Health Check
      tags:
      - system
  /api/subscriber/remove/{list_id}:
    delete:
      consumes:
      - application/json
      description: Removes a contact from a mailing list using unsubscribe token
      parameters:
      - description: Public List ID
        in: path
        name: list_id
        required: true
        type: string
      - description: Unsubscribe payload
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/internal_handlers_contact.UnsubscribeInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers_contact.UnsubscribeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.UnauthorizedResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.NotFoundErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ServerErrorResponse'
      summary: Unsubscribe from mailing list
      tags:
      - subscribe
  /api/subscriber/signup/{list_id}/subscribe:
    post:
      consumes:
      - application/json
      description: Initiates email verification subscription flow for a mailing list
      parameters:
      - description: Public List ID
        in: path
        name: list_id
        required: true
        type: string
      - description: Email subscription input
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers_contact.EmailInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers_contact.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ValidationErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ForbiddenResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.NotFoundErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ServerErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ServerErrorResponse'
      summary: Subscribe to mailing list
      tags:
      - subscribe
  /api/subscriber/signup/confirm:
    get:
      consumes:
      - application/json
      description: Confirms email subscription after verification
      parameters:
      - description: Public List ID
        in: query
        name: list_id
        required: true
        type: string
      - description: Verification Token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers_contact.SubscribeConfirmResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.UnauthorizedResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ForbiddenResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.NotFoundErrorResponse'
        "410":
          description: Gone
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ServerErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ServerErrorResponse'
      summary: Confirm subscription
      tags:
      - subscribe
  /api/user/account/delete:
    delete:
      consumes:
      - application/json
      description: Permanently deletes the authenticated user's account after verifying
        password
      parameters:
      - description: User password confirmation
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/internal_handlers_user.PasswordInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers_user.SuccessMessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ValidationErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.UnauthorizedResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.NotFoundErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ServerErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete user account
      tags:
      - user
  /api/user/change-password/{token}:
    post:
      consumes:
      - application/json
      description: |-
        Validates the reset token and updates the user's password.
        Automatically logs the user in by setting a session cookie upon success.
      parameters:
      - description: Reset Token
        in: path
        name: token
        required: true
        type: string
      - description: New Password
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/internal_handlers_auth.PasswordInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers_auth.ResetPasswordResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ValidationErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ServerErrorResponse'
      summary: Change Password
      tags:
      - accounts
  /api/user/change/email:
    patch:
      consumes:
      - application/json
      description: Sends a confirmation email to complete the email change process
      parameters:
      - description: New email address
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/internal_handlers_user.ChangeEmailInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers_user.SuccessMessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ValidationErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.UnauthorizedResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.AlreadyExistsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ServerErrorResponse'
      security:
      - BearerAuth: []
      summary: Request email change
      tags:
      - user
  /api/user/change/email/confirm:
    put:
      consumes:
      - application/json
      description: Validates token and updates user email
      parameters:
      - description: Email change token
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/internal_handlers_user.ChangeEmailConfirmInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers_user.SuccessMessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ValidationErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.NotFoundErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ServerErrorResponse'
      summary: Confirm email change
      tags:
      - user
  /api/user/change/username:
    put:
      consumes:
      - application/json
      description: Updates the authenticated user's display name
      parameters:
      - description: New username
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/internal_handlers_user.ChangeUsernameInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers_user.SuccessMessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ValidationErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.UnauthorizedResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.NotFoundErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ServerErrorResponse'
      security:
      - BearerAuth: []
      summary: Change username
      tags:
      - user
  /api/user/cycle-token:
    post:
      consumes:
      - application/json
      description: Invalidates the old API token and generates a new one. Requires
        password confirmation and a valid session cookie.
      parameters:
      - description: Confirm password to rotate token
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/internal_handlers_auth.PasswordInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers_auth.CycleTokenResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.UnauthorizedResponse'
        "404":
          description: Session not valid or not found
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.NotFoundErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ServerErrorResponse'
      summary: Rotate API Token
      tags:
      - accounts
  /api/user/forgot-password:
    post:
      consumes:
      - application/json
      description: |-
        Sends a password reset link to the provided email if the account exists.
        Always returns a success message to prevent email enumeration.
      parameters:
      - description: User Email
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/internal_handlers_auth.ForgotPasswordInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers_auth.ForgotPasswordResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ValidationErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ServerErrorResponse'
      summary: Request Password Reset
      tags:
      - accounts
  /api/user/login:
    post:
      consumes:
      - application/json
      description: |-
        Login for exisitng user using email and passwrod (compares the stored hash to the input).
        Returns a success message and sets an HttpOnly 'token' cookie.
      parameters:
      - description: User Login Credentials
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/internal_handlers_auth.LoginInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_handlers_auth.LoginResponse'
        "400":
          description: Invalid input or malformed email
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ValidationErrorResponse'
        "401":
          description: Validation failed
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.UnauthorizedResponse'
        "500":
          description: Server error
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ServerErrorResponse'
      summary: Login Existing User
      tags:
      - accounts
  /api/user/logout:
    post:
      description: Invalidates the session by clearing the 'token' cookie.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              description: token=; Max-Age=0; Path=/; HttpOnly; Secure
              type: string
          schema:
            $ref: '#/definitions/internal_handlers_auth.LogOutResponse'
        "401":
          description: Session expired or invalid
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ServerErrorResponse'
      summary: User Logout
      tags:
      - accounts
  /api/user/me:
    get:
      description: Returns the details of the authenticated user based on the session
        cookie.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers_auth.LoginResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ServerErrorResponse'
      summary: Get Current User Info
      tags:
      - accounts
  /api/user/register:
    post:
      consumes:
      - application/json
      description: |-
        Creates a user account, hashes the password, and hashes and API token.
        Returns a one-time API token and sets an HttpOnly 'token' cookie.
      parameters:
      - description: User Registration Data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/internal_handlers_auth.RegisterInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_handlers_auth.RegisterResponse'
        "400":
          description: Validation failed
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ValidationErrorResponse'
        "409":
          description: User already exists with email
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.AlreadyExistsResponse'
        "500":
          description: Server error
          schema:
            $ref: '#/definitions/log_relay_internal_dtos.ServerErrorResponse'
      summary: Register New User
      tags:
      - accounts
swagger: "2.0"
